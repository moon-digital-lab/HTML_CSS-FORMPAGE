<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abiodun Portfolio</title>
    <!-- Links to our stylesheet -->
    
    <link rel="stylesheet" href="css/main.css">
</head>

<body>

    <section class="wrapper-main">
        <form action="example.html" method="post">
            <label for="firstname">Firstname</label>
            <br>
            <input type="text" id="firstname" name="firstname" placeholder="firstname">
            <br><br>
            <label for="email">Email</label>
            <br>
            <input type="text" id="email" name="email" placeholder="email">
            <br><br>
            <label for="pwd">Password</label>
            <br>
            <input type="password" id="password" name="pwd" placeholder="password">
            <br><br>
            <label for="message">Write something cool</label>
            <br>
            <textarea name="message" id="message" placeholder="write a message..."></textarea>
            <br><br>
            <label>Pick your eyecolor</label>
            <br>
            <input type="radio" id="eyecolorblue" name="eyecolor" value="Blue"></input>
            <label for="eyecolorblue">blue</label>
            <input type="radio" id="eyecolorbrown" name="eyecolor" value="Brown"></input>
            <label for="eyecolorbrown">brown</label>
            <input type="radio" id="eyecolorgreen" name="eyecolor value="Green"></input>
            <label for="eyecolorgreen">green</label>
            <br><br>
            <label>What pet do you have?</label>
            <br>
            <input type="checkbox" id="petcat" name="petcat" value="Cat"></input>
            <label for="petcat">Cat</label>
            <input type="checkbox" id="petdog" name="petdog" value="dog"></input>
            <label for="petdog">Dog</label>
            <input type="checkbox" id="petbird" name="petbird" value="bird"></input>
            <label for="petbird">Bird</label>
            <br><br>
            <label for="cartype">Car type you own?</label>
            <br>
            <select name="cartype" id="cartype">
                <option value="none">None</option>
                <option value="Ford">Ford</option>
                <option value="Mustang">Mustang</option>
                <option value="Toyota">Toyota</option>
            </select>
            <br><br>
            <button type="submit" value="Submit">Send data</button>
        </form
    </section>
</body>
</html>
